name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Install required testing dependencies (no heavy GPU libs)
        pip install fastapi httpx python-multipart scipy numpy requests python-dotenv openai

    - name: Run Fast Tests
      env:
        # Inject fake tokens so the app doesn't crash on import
        VISION_API_TOKEN: "test-token"
        FATSECRET_CLIENT_ID: "test-id"
        FATSECRET_CLIENT_SECRET: "test-secret"
      run: |
        # Run everything in tests/, but explicitly ignore the live E2E tests
        pytest tests/ --ignore=tests/e2e -v