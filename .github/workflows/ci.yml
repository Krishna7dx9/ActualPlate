name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-asyncio==1.4.1.post1" "opencv-python-headless==5.0.0.93" "Pillow>=10,<13"
          python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Validate shell entrypoint
        run: bash -n start.sh

      - name: Run automated tests (excluding live E2E)
        env:
          APP_ENV: test
          VISION_API_TOKEN: "test-token"
          FATSECRET_CLIENT_ID: "test-id"
          FATSECRET_CLIENT_SECRET: "test-secret"
          OPENROUTER_API_KEY: "fake-openrouter-key"
        run: python -m pytest tests/ --ignore=tests/e2e -v
