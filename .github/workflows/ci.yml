name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Install CPU-only PyTorch to avoid huge downloads
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install other required dependencies
        pip install fastapi httpx python-multipart scipy numpy requests python-dotenv openai opencv-python-headless 'Pillow>=10,<13'

    - name: Run Fast Tests
      env:
        # Inject fake tokens so the app doesn't crash on import
        VISION_API_TOKEN: "test-token"
        FATSECRET_CLIENT_ID: "test-id"
        FATSECRET_CLIENT_SECRET: "test-secret"
        OPENROUTER_API_KEY: "fake-openrouter-key"
      run: |
        # Run everything in tests/, but explicitly ignore the live E2E tests
        pytest tests/ --ignore=tests/e2e -v